  <style>
    html {

    /* Modal Styles */

      top: 0;

    .modal-content-base { /* New base class for animated modal content */

    .modal-content-base.modal-open { /* Active state for animation */
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    /* AI Chat Enhancements */
    .ai-chat-shortcut-button {

    /* ── Spotify shimmer loading skeleton ─────────────────────────────────── */
    @keyframes spotify-shimmer {

    /* Pets Panel Enhancements */
    .pet-speech-bubble {
      position: absolute;
      background-color: var(--sidebar-item-hover-background, #2A2D2E);
      color: var(--text-default, #D4D4D4);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.75rem; /* 12px */
      border: 1px solid var(--border-color, #333333);
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      max-width: 150px;
      text-align: center;
      z-index: 10;
      opacity: 0;
      animation: fadeInBubble 0.3s ease-out forwards, fadeOutBubble 0.3s ease-in 5.7s forwards; /* Show for 5.7s + 0.3s fade in = 6s */
    }

    .pet-speech-bubble::after { /* Speech bubble tail */
      content: '';
      position: absolute;
      bottom: -5px; /* Adjust to position tail correctly */
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 6px solid var(--sidebar-item-hover-background, #2A2D2E);
      filter: drop-shadow(0 1px 0.5px var(--border-color, #333333)); /* Attempt to match border color */
    }

    @keyframes fadeInBubble {
      to { opacity: 1; transform: translateY(-5px) translateX(-50%); } /* Adjust translateX based on final bubble positioning logic */
    }
    @keyframes fadeOutBubble {
      from { opacity: 1; transform: translateY(-5px) translateX(-50%); }
      to { opacity: 0; transform: translateY(0px) translateX(-50%); }
    }

    /* Liquid Glass theme — layered translucency, specular edges, and aurora depth. */
    html[data-theme="Liquid Glass"] body {
      background:
        radial-gradient(55rem 45rem at 8% 8%, rgba(30, 120, 255, 0.30), transparent 62%),
        radial-gradient(48rem 40rem at 88% 18%, rgba(156, 73, 255, 0.22), transparent 64%),
        radial-gradient(40rem 38rem at 60% 100%, rgba(30, 215, 190, 0.16), transparent 68%),
        #070a14;
    }
    html[data-theme="Liquid Glass"] .app-shell {
      position: relative;
      isolation: isolate;
      background: transparent;
      width: 100%;
      height: 100dvh;
      min-height: 100dvh;
      max-height: 100dvh;
      overflow: clip;
    }
    html[data-theme="Liquid Glass"] .app-shell::after {
      content: "";
      position: absolute;
      inset: -32%;
      z-index: -2;
      pointer-events: none;
      background:
        radial-gradient(circle at 28% 34%, rgba(46, 151, 255, .25), transparent 23%),
        radial-gradient(circle at 72% 32%, rgba(145, 80, 255, .20), transparent 22%),
        radial-gradient(circle at 58% 76%, rgba(35, 220, 190, .13), transparent 21%);
      filter: blur(30px) saturate(125%);
      transform-origin: center;
      will-change: transform, opacity;
      animation: liquidAuroraOrbit 28s ease-in-out infinite alternate;
    }
    html[data-theme="Liquid Glass"] .app-shell::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      opacity: .28;
      background-image: linear-gradient(rgba(255,255,255,.022) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px);
      background-size: 36px 36px;
      mask-image: linear-gradient(to bottom, black, transparent 78%);
      will-change: background-position, opacity;
      animation: liquidGridDrift 26s linear infinite, liquidGridBreath 9s ease-in-out infinite alternate;
    }
    html[data-theme="Liquid Glass"] .bg-\[var\(--titlebar-background\)\],
    html[data-theme="Liquid Glass"] .bg-\[var\(--activitybar-background\)\],
    html[data-theme="Liquid Glass"] .bg-\[var\(--sidebar-background\)\],
    html[data-theme="Liquid Glass"] .bg-\[var\(--breadcrumbs-background\)\],
    html[data-theme="Liquid Glass"] .bg-\[var\(--statusbar-background\)\] {
      backdrop-filter: blur(24px) saturate(150%);
      -webkit-backdrop-filter: blur(24px) saturate(150%);
